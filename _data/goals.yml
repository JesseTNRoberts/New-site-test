# Progress trackers shown on the homepage (rendered by _includes/goals.html).
#
# Trackers count from Jan 1 to Dec 31 of `year`. Each January, bump `year` and
# set new targets; the automatic counts restart on their own.
#
#   source: scholar  count of papers dated `year` on Google Scholar (updated daily)
#   source: strava   year-to-date running miles from Strava totals; public activities only (daily)
#   source: manual   uses `current` below; update it by hand
#
# Live numbers are written to _data/stats.yml by scripts/update_stats.rb.

year: 2026

trackers:
  - id: publications
    label: Publications
    unit: papers
    verb: Published
    source: scholar
    target: 10        # TODO: confirm 2026 target

  - id: miles
    label: Miles
    unit: miles
    verb: Ran
    source: strava
    target: 1000      # TODO: confirm 2026 target

  - id: grants
    label: Grants
    unit: proposals
    verb: Submitted
    source: manual
    current: 0        # TODO: 2026 submissions so far
    target: 4         # TODO: confirm 2026 target
    # 2025 (5 submitted): Schmidt Sciences Cherokee; Schmidt Sciences inference-time
    # uncertainty; NSF NAIRR; NSF Amani; ONR white paper
