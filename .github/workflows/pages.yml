# Builds the site with Jekyll and publishes it to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The custom domain (www.jessetnroberts.com) stays configured in Settings -> Pages, so
# project sites such as /torch-canvas/ keep being served under it.
#
# A daily scheduled run refreshes the homepage trackers and the Publications page from
# Google Scholar and Strava (scripts/update_stats.rb) and redeploys. Optional repo secrets:
#   SERPAPI_KEY            mirrors Google Scholar (Scholar blocks GitHub's servers directly)
#   STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, STRAVA_REFRESH_TOKEN  (see scripts/strava_auth.rb)
# Without them, those sources are skipped and everything else still works.
name: Build and deploy site

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *" # daily, ~5:23am Central

permissions:
  contents: write # lets the scheduled run save refreshed stats back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Refresh live numbers (Scholar publications, Strava miles). Failures never block the
      # deploy: the script keeps the last good numbers for any source that doesn't answer.
      - name: Refresh stats from Google Scholar and Strava
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: ruby scripts/update_stats.rb
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}

      # On scheduled/manual runs, commit the refreshed data so the repo keeps the latest
      # numbers (and a fallback if a source is down tomorrow). Timestamp-only changes are
      # not committed, to keep history quiet.
      - name: Save refreshed stats
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          files=""
          for f in _data/stats.yml _data/publications.yml; do [ -f "$f" ] && files="$files $f"; done
          [ -n "$files" ] && git add -N $files
          if git diff -U0 -- $files | grep -E '^[+-][^+-]' | grep -vqE '^[+-]\s*updated:'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $files
            git commit -m "Update stats from Google Scholar and Strava"
            if git push; then echo "::notice title=stats::Committed refreshed stats"
            else echo "::warning title=stats::Push of refreshed stats failed; will retry next run"; fi
          else
            echo "::notice title=stats::No data changes to commit"
          fi

      - id: pages
        uses: actions/configure-pages@v5

      # Build for wherever this repo is published (the real domain, or a preview copy
      # such as https://www.jessetnroberts.com/site-preview/), so CSS and links stay on that copy.
      - name: Build with Jekyll
        run: |
          echo "url: \"${{ steps.pages.outputs.origin }}\"" > _config.deploy.yml
          bundle exec jekyll build --config _config.yml,_config.deploy.yml --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    # Pull requests only build (as a check); pushes, the daily schedule, and manual runs deploy.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
